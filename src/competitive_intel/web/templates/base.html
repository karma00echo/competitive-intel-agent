<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}竞品情报控制台{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}?v=12">
  <link rel="stylesheet" href="{{ url_for('static', path='/workspace.css') }}?v=12">
  <link rel="stylesheet" href="{{ url_for('static', path='/intelligence.css') }}?v=85">
</head>
<body data-page="{{ page }}" data-resource-id="{{ resource_id|default('') }}">
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">CI</span>Competitive<br>Intelligence</a>
    <nav class="topnav" aria-label="Main navigation">
      <a href="/" {% if page == 'command-center' %}aria-current="page"{% endif %}>Command Center</a>
      <a href="/signals" {% if page == 'signals' %}aria-current="page"{% endif %}>Signals</a>
      <a href="/analyst" {% if page == 'analyst' %}aria-current="page"{% endif %}>Analyst <small>Preview</small></a>
      <a href="/competitors" {% if page in ['competitors', 'intelligence-profile'] %}aria-current="page"{% endif %}>Competitors</a>
      <a href="/reports" {% if page in ['reports', 'report'] %}aria-current="page"{% endif %}>Reports</a>
      <a href="/developer" {% if page in ['home', 'workspace', 'run'] %}aria-current="page"{% endif %}>Developer</a>
    </nav>
    <span class="badge">本地控制台</span>
  </header>
  <main class="shell">{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', path='/app.js') }}?v=12" defer></script>
  <script src="{{ url_for('static', path='/intelligence.js') }}?v=85" defer></script>
</body>
</html>
