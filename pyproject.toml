[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-competitive-intelligence-agent"
version = "0.1.0"
description = "A controlled, evidence-backed competitive intelligence agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyMySQL>=1.1,<2",
    "SQLAlchemy>=2.0,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: requires a disposable local MySQL test database",
]

